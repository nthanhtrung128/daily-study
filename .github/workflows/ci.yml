name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:content
      - run: npm run build

  e2e:
    name: Playwright (iPhone 14, iPhone SE)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium + WebKit (engine của Safari); PW_WEBKIT=1 bật thêm 2 project WebKit trong playwright.config.ts.
      - run: npx playwright install --with-deps webkit chromium
      - run: npm run test:e2e
        env:
          PW_WEBKIT: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # Trace có thể chứa nội dung bài học và trạng thái trình duyệt.
        if: failure() && github.event.repository.private == true
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
